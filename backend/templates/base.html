<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}L-ESCROW{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-mono">

  <nav class="border-b border-gray-800 px-6 py-3 flex items-center justify-between">
    <span class="text-amber-400 font-bold tracking-widest text-sm">L-ESCROW</span>
    <div class="flex gap-6 text-sm text-gray-400">
      <a href="/" class="hover:text-white transition-colors">Dashboard</a>
      <a href="/marketplace" class="hover:text-white transition-colors">Marketplace</a>
      <a href="/sandbox" class="hover:text-white transition-colors">Sandbox</a>
      <a href="/settings" class="hover:text-white transition-colors">Settings</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/locus-integration.js"></script>
</body>
</html>
